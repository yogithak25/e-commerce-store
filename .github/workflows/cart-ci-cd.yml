name: Cart Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'cart-cna-microservice/**'
      - 'helm-charts/cart-service/**'
      - '.github/workflows/cart-ci-cd.yml'

env:
  IMAGE_NAME: yogithak/cart-service

jobs:

  cart-ci-cd:

    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: ./cart-cna-microservice

    steps:

    # STEP 1 - Checkout Repository
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # STEP 2 - Setup Java
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    # STEP 3 - Grant Gradle Permission
    - name: Grant Execute Permission
      run: chmod +x gradlew

    # STEP 4 - Run Tests
    - name: Run Unit Tests
      run: ./gradlew test

    # STEP 5 - Build Spring Boot Application
    - name: Build JAR File
      run: ./gradlew build

    # STEP 6 - DockerHub Login
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # STEP 7 - Build Docker Image
    - name: Build Docker Image
      run: |
        docker build \
        -t $IMAGE_NAME:v1.${{ github.run_number }} .

    # STEP 8 - Push Docker Image
    - name: Push Docker Image
      run: |
        docker push $IMAGE_NAME:v1.${{ github.run_number }}

    # STEP 9 - Update Helm values.yaml
    - name: Update Helm Chart Image Tag
      working-directory: .
      run: |
        sed -i 's/tag:.*/tag: "v1.'"${{ github.run_number }}"'"/' helm-charts/cart-service/values.yaml

    # STEP 10 - Commit Updated Helm Chart
    - name: Commit Helm Chart Changes
      working-directory: .
      run: |
        git config --global user.email "yogithak25@gmail.com"
        git config --global user.name "yogithak25"

        git add helm-charts/cart-service/values.yaml

        git commit -m "Updated cart-service image tag to v1.${{ github.run_number }}" || echo "No changes to commit"

        git push
