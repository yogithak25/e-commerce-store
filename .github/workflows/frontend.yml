name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'store-ui/**'
      - 'helm-charts/frontend/**'

env:
  IMAGE_NAME: yogithak/frontend-service

jobs:

  frontend-ci-cd:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./store-ui

    steps:

    # STEP 1 - Checkout Repository
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # STEP 2 - Setup NodeJS
    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: store-ui/package-lock.json

    # STEP 3 - Install Dependencies
    - name: Install Dependencies
      run: npm install

    # STEP 4 - Run Frontend Build Validation
    - name: Build React Application
      run: npm run build

    # STEP 5 - DockerHub Login
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # STEP 6 - Build Docker Image
    - name: Build Docker Image
      run: |
        docker build \
        -t $IMAGE_NAME:v1.${{ github.run_number }} .

    # STEP 7 - Push Docker Image
    - name: Push Docker Image
      run: |
        docker push $IMAGE_NAME:v1.${{ github.run_number }}

    # STEP 8 - Update Helm values.yaml
    - name: Update Helm Chart Image Tag
      working-directory: .
      run: |
        sed -i 's/tag:.*/tag: "v1.'"${{ github.run_number }}"'"/' helm-charts/frontend/values.yaml

    # STEP 9 - Commit Updated Helm Chart
    - name: Commit Helm Chart Changes
      working-directory: .
      run: |
        git config --global user.email "yogithak25@gmail.com"
        git config --global user.name "yogithak25"

        git add helm-charts/frontend/values.yaml

        git commit -m "Updated frontend image tag to v1.${{ github.run_number }}" || echo "No changes to commit"

        git push
